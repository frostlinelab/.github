<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery — Frostline Lab</title>
<meta name="description" content="Browse every Frostline Lab project: filter by topic and status, search, and keep the ones you care about.">
<meta property="og:type" content="website">
<meta property="og:title" content="Gallery — Frostline Lab">
<meta property="og:description" content="Filter, search and save Frostline Lab projects.">
<meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1119" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="gallery" data-title-key="meta.title.gallery">

<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">
      <img class="brand__mark" src="assets/brand/frostline-lab.webp" alt="" width="24" height="24">
      <span class="brand__name">Frostline Lab</span>
    </a>
    <nav class="nav">
      <a href="index.html" data-i18n="nav.home"></a>
      <a href="gallery.html" aria-current="page" data-i18n="nav.gallery"></a>
      <a href="https://github.com/frostlinelab" target="_blank" rel="noopener" data-i18n="nav.github"></a>
      <button class="lang-toggle lang-toggle--icon" type="button" data-theme-toggle data-i18n-aria="nav.theme"></button>
      <button class="lang-toggle" type="button" data-lang-toggle></button>
    </nav>
  </div>
</header>

<main id="main">

  <section class="hero hero--compact wrap">
    <h1 data-i18n="gallery.title"></h1>
    <p class="lede" data-i18n="gallery.lede"></p>
  </section>

  <section class="wrap">
    <div class="toolbar">
      <div class="toolbar__row">
        <label class="search">
          <span class="sr-only" data-i18n="gallery.search"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
          <input type="search" data-search data-i18n-ph="gallery.searchPlaceholder" data-i18n-aria="gallery.search">
        </label>
        <span class="field">
          <span data-i18n="gallery.sort"></span>
          <select data-sort>
            <option value="featured" data-i18n="gallery.sort.featured"></option>
            <option value="updated" data-i18n="gallery.sort.updated"></option>
            <option value="name" data-i18n="gallery.sort.name"></option>
          </select>
        </span>
        <button class="btn btn--small" type="button" data-only-favs aria-pressed="false"></button>
        <button class="btn btn--small" type="button" data-copy-favs data-i18n="gallery.copy" disabled></button>
        <span class="results" data-results aria-live="polite"></span>
      </div>
      <div class="toolbar__row">
        <span class="group-label" data-i18n="gallery.tags"></span>
        <div class="chips" data-tag-chips></div>
      </div>
      <div class="toolbar__row">
        <span class="group-label" data-i18n="gallery.status"></span>
        <div class="chips" data-status-chips></div>
        <button class="btn btn--quiet btn--small" type="button" data-clear data-i18n="gallery.clear"></button>
      </div>
    </div>

    <noscript>
      <div class="empty">
        <p>This gallery is rendered by JavaScript. The same projects are listed in the
          <a href="https://github.com/frostlinelab">organization README</a>.</p>
      </div>
    </noscript>

    <div class="grid" data-grid></div>

    <div class="empty" data-empty hidden>
      <p data-empty-msg></p>
      <button class="btn btn--small" type="button" data-clear data-i18n="gallery.clear"></button>
    </div>

    <p class="section__note" style="margin-top:14px" data-i18n="gallery.note"></p>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span>© <span data-year>2026</span> Frostline Lab</span>
    <nav>
      <a href="index.html" data-i18n="nav.home"></a>
      <a href="https://github.com/frostlinelab" target="_blank" rel="noopener" data-i18n="nav.github"></a>
    </nav>
    <span class="spacer"></span>
    <span data-i18n="footer.built"></span>
  </div>
</footer>

<script src="assets/js/site.js"></script>
</body>
</html>
